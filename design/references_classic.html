function controlled(){if(!state.contract)return state.turn===state.seat;const dummy=(state.contract.declarer+2)%4;return (state.turn===dummy?state.contract.declarer:state.turn)===state.seat}
function deal(){let seed=state.board*7919;const seeded=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const deck=Array.from({length:52},(_,i)=>i);for(let i=51;i>0;i--){let j=Math.floor(seeded()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}state.hands=[0,1,2,3].map(i=>deck.slice(i*13,i*13+13));state.original=state.hands.map(h=>[...h]);state.dealer=(state.board-1)%4;state.turn=state.dealer;state.auction=[];state.contract=null;state.trick=[];state.tricks=[0,0];state.record=[];state.completedTricks=[];state.selected=null;state.phase='bid';state.dummyOpen=false;state.paused=false;render();schedule()}
function schedule(){clearTimeout(state.timer);if(state.paused)return;if(state.phase==='bid'&&state.turn!==state.seat)state.timer=setTimeout(()=>bid(null),700);if(state.phase==='play'&&!controlled())state.timer=setTimeout(()=>{const legal=legalCards(state.turn);if(legal.length)play(legal[Math.floor(Math.random()*legal.length)])},700)}
function bid(contract){if(state.paused||state.phase!=='bid')return;state.auction.push({seat:state.turn,call:contract?`${contract.level}${contract.suit===4?'NT':suits[contract.suit]}`:'不叫'});if(contract)state.contract={...contract,declarer:state.turn};state.turn=(state.turn+1)%4;const last=state.auction.slice(-3);if(state.contract&&last.length===3&&last.every(b=>b.call==='不叫')){state.phase='play';state.turn=(state.contract.declarer+1)%4}else if(!state.contract&&state.auction.length>=4){finish(true);return}render();schedule()}
function play(c){if(state.paused||state.phase!=='play'||state.trick.length===4||!legalCards(state.turn).includes(c))return;const seat=state.turn;state.hands[seat]=state.hands[seat].filter(x=>x!==c);state.trick.push({seat,card:c});state.record.push(`${directions[seat]} · ${cardLabel(c)}`);state.selected=null;state.dummyOpen=true;if(state.trick.length===4){render();state.timer=setTimeout(resolveTrick,900);return}state.turn=(seat+1)%4;render();schedule()}
function resolveTrick(){if(state.paused)return;const lead=Math.floor(state.trick[0].card/13),trump=state.contract.suit;const strength=c=>(Math.floor(c/13)===trump?100:Math.floor(c/13)===lead?50:0)+c%13;let winner=state.trick.reduce((a,b)=>strength(b.card)>strength(a.card)?b:a);state.completedTricks.push({cards:state.trick.map(x=>({...x})),winner:winner.seat});state.tricks[winner.seat%2]++;state.record.push(`第 ${state.tricks[0]+state.tricks[1]} 墩 · ${directions[winner.seat]}赢墩`);state.trick=[];state.turn=winner.seat;if(state.tricks[0]+state.tricks[1]===13){finish(false);return}render();schedule()}
function finish(passed){state.phase='result';state.passed=passed;state.points=0;if(!passed){const c=state.contract,got=state.tricks[c.declarer%2],needed=c.level+6,base=c.suit<2?20*c.level:30*c.level+(c.suit===4?10:0);const board=(state.board-1)%16;const vulNS=[1,3,4,6,9,11,12,14].includes(board),vulEW=[2,3,5,6,8,9,12,15].includes(board),vul=c.declarer%2===0?vulNS:vulEW;state.points=got>=needed?base+(base>=100?(vul?500:300):50)+(got-needed)*(c.suit<2?20:30)+(c.level===6?(vul?750:500):c.level===7?(vul?1500:1000):0):-(needed-got)*(vul?100:50);state.total[c.declarer%2]+=state.points;state.total[1-c.declarer%2]-=state.points}render()}
function vulText(){const b=(state.board-1)%16;return ['双方无局','南北有局','东西有局','双方有局','南北有局','东西有局','双方有局','双方无局','东西有局','双方有局','双方无局','南北有局','双方有局','双方无局','南北有局','东西有局'][b]}
function seatHTML(s){const active=state.phase!=='lobby'&&state.phase!=='result'&&state.turn===s;return `<div class="seat ${active?'active':''}"><span class="avatar">${directions[s]}</span><span class="seat-name">${esc(nameOf(s))}${s===state.seat?' · 你':''}</span><small>${state.phase==='lobby'?(s===state.seat?'房主':'开局补位'):(active?'当前行动':`${state.hands[s].length} 张牌`)}</small></div>`}
function render(){document.body.dataset.phase=state.phase;const lobby=state.phase==='lobby',result=state.phase==='result',isBid=state.phase==='bid';$('#board').textContent=`第 ${String(state.board).padStart(2,'0')} 副`;$('#meta').textContent=`${directions[state.dealer]}家发牌 · ${vulText()}`;$('#phase').textContent=lobby?'等你入座':result?'本副结束':isBid?'叫牌阶段':'打牌阶段';$('#pause').disabled=lobby||result;$('#pause').textContent=state.paused?'继续对局':'暂停';$('#pause-banner').classList.toggle('hidden',!state.paused);[0,1,2,3].forEach(s=>$('.'+['north','east','south','west'][s]).innerHTML=seatHTML(s));$('#ns').textContent=state.total[0];$('#ew').textContent=state.total[1];$('#center').innerHTML=lobby?'<div class="compass">桥牌</div><p>和朋友一起玩</p><small>空位由电脑牌手补齐</small>':result?`<div class="compass">${state.passed?'全体不叫':'本副完成'}</div><p>这一副结束啦</p>`:state.trick.length?`<div class="trick">${state.trick.map(x=>`<div class="mini-card ${red(x.card)?'red':''}">${cardLabel(x.card)}<small>${directions[x.seat]}</small></div>`).join('')}</div><small>南北 ${state.tricks[0]} 墩 · 东西 ${state.tricks[1]} 墩</small>`:`<div class="compass">${isBid?'N · S':`${state.contract.level}${state.contract.suit===4?'NT':suits[state.contract.suit]}`}</div><p>${isBid?'等候叫牌':`${directions[state.contract.declarer]}家做庄`}</p><small>${isBid?'南北搭档 / 东西搭档':`南北 ${state.tricks[0]} 墩 · 东西 ${state.tricks[1]} 墩`}</small>`;
$('#hand-title').textContent=`${directions[state.seat]}家手牌`;$('#hand-note').textContent=lobby?'开局后发牌':isBid?'先选阶数和花色，再确认':result?'本副已结束':controlled()?'点选手牌，再点同一张打出':'等待其他牌手出牌';$('#hand').innerHTML=lobby?'<div class="backs">'+Array(8).fill('<span class="back"></span>').join('')+'</div>':grouped(state.hands[state.seat],state.phase==='play'&&controlled()&&state.turn===state.seat&&!state.paused&&state.trick.length<4);
const dummy=state.contract?(state.contract.declarer+2)%4:-1;$('#dummy').classList.toggle('hidden',!(state.dummyOpen&&state.phase==='play'));if(state.dummyOpen&&state.phase==='play')$('#dummy').innerHTML=`<div class="od-row"><strong>${directions[dummy]}家明手</strong><span class="muted">由${directions[state.contract.declarer]}家操作</span></div><div class="hand">${grouped(state.hands[dummy],controlled()&&state.turn===dummy&&!state.paused&&state.trick.length<4)}</div>`;
let rows='';for(let i=0;i<Math.max(4,Math.ceil((state.dealer+state.auction.length)/4)*4);i+=4){rows+='<tr>';for(let j=0;j<4;j++){let b=state.auction[i+j-state.dealer];rows+=`<td>${b?b.call:'—'}</td>`}rows+='</tr>'}$('#auction').innerHTML=rows;
$('#controls').innerHTML=lobby?`<h2>入座开局</h2><p class="muted">写下昵称，再选一个座位。</p><label class="field" style="margin-top:16px">你的昵称（必填）<input id="nickname" maxlength="12" value="${esc(state.name)}" placeholder="输入昵称" autocomplete="nickname" required aria-describedby="name-error"></label><p id="name-error" class="error" role="alert"></p><p style="margin-bottom:8px">选择座位</p><div class="seat-options">${directions.map((d,i)=>`<button data-seat="${i}" class="${i===state.seat?'chosen':''}" aria-pressed="${i===state.seat}">${d}</button>`).join('')}</div><button class="primary" id="start" style="width:100%;margin-top:24px">开始对局</button>`:result?`<div class="result"><p class="eyebrow">本副结算</p><h2>${state.passed?'全体不叫':state.points>=0?'定约完成':'定约未完成'}</h2><strong class="result-number">${state.points>0?'+':''}${state.points}<small> 分</small></strong><p>${state.passed?'本副不计分，发牌人轮换。':`${directions[state.contract.declarer]}家 ${state.contract.level}${state.contract.suit===4?'NT':suits[state.contract.suit]} · ${vulText()} · 未加倍，取得 ${state.tricks[state.contract.declarer%2]} 墩，需要 ${state.contract.level+6} 墩。`}</p><button id="show-hands">查看四家手牌</button><div class="rest-note"><p>这一副结束了，休息一下吧。</p><small>下一副不会自动开始。</small><button id="rest">休息一下</button></div><button class="primary" id="next">准备下一副</button><small>电脑牌手已准备</small></div>`:isBid?`<p class="eyebrow">${state.turn===state.seat?'轮到你叫牌':'等待电脑叫牌'}</p><h2>选择你的叫品</h2><div class="bid-select"><label class="od-field">阶数<select id="level">${[1,2,3,4,5,6,7].map(n=>`<option>${n}</option>`).join('')}</select></label><label class="od-field">花色<select id="suit">${['♣ 梅花','♦ 方块','♥ 红桃','♠ 黑桃','NT 无将'].map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select></label></div><div class="action-row"><button id="pass" ${state.turn!==state.seat||state.paused?'disabled':''}>不叫</button><button id="bid" class="primary" ${state.turn!==state.seat||state.paused?'disabled':''}>确认叫牌</button></div><p class="muted" style="margin-top:16px">这是练习牌桌，电脑会选择“不叫”。</p>`:`<p class="eyebrow">${state.trick.length===4?'本墩结算中':controlled()?'轮到你出牌':'等待电脑出牌'}</p><h2>${state.turn===dummy&&controlled()?'请替明手选牌':'直接在牌上出牌'}</h2><p class="muted" style="margin-top:16px">${state.trick.length?'有相同花色，就要跟出这个花色。虚线边框的牌暂时不能出。':'这一墩由你先出，可以选任意一张。'}</p><p class="feedback" role="status">${state.selected===null?'点一下选牌，再点同一张打出。':`已选 ${cardLabel(state.selected)}，再点这张牌打出。`}</p>`;
renderHistory();bind()}
function bind(){$$('[data-card]').forEach(b=>b.onclick=()=>{const c=Number(b.dataset.card);if(state.paused||state.phase!=='play'||!controlled()||state.trick.length===4)return;if(state.selected===c){play(c)}else{state.selected=c;render();document.querySelector('.card.selected:not(:disabled)')?.focus({preventScroll:true})}});$$('[data-seat]').forEach(b=>b.onclick=()=>{state.name=$('#nickname').value;state.seat=Number(b.dataset.seat);render()});if($('#nickname'))$('#nickname').onblur=()=>{$('#name-error').textContent=$('#nickname').value.trim()?'':'请填写昵称后开始对局';state.name=$('#nickname').value.trim()};if($('#start'))$('#start').onclick=()=>{state.name=$('#nickname').value.trim();if(!state.name){$('#name-error').textContent='请填写昵称后开始对局';$('#nickname').focus();return}deal()};if($('#bid'))$('#bid').onclick=()=>bid({level:Number($('#level').value),suit:Number($('#suit').value)});if($('#pass'))$('#pass').onclick=()=>bid(null);if($('#rest'))$('#rest').onclick=()=>{show('休息一下', '<p>把目光从屏幕移开，看看远处，也可以起身走走。</p><p>这一副的结果和累计分都留在这里。不刷新或关闭页面，回来还可以继续。</p>');$('#close-dialog').textContent='返回牌桌'};if($('#next'))$('#next').onclick=()=>{state.board++;deal()};if($('#show-hands'))$('#show-hands').onclick=()=>show('四家手牌',state.original.map((h,i)=>`<section><h3>${directions[i]}家 · ${esc(nameOf(i))}</h3><p>${[...h].sort((a,b)=>b-a).map(cardLabel).join('　')}</p></section>`).join(''))}
function $$(s){return [...document.querySelectorAll(s)]}function show(title,body){$('#close-dialog').textContent='关闭';$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog').showModal()}

function historyMarkup(){
 const rows=state.completedTricks.map((t,i)=>({...t,number:i+1}));
 if(state.trick.length)rows.push({cards:state.trick,winner:null,number:rows.length+1});
 if(!rows.length)return '<p class="muted">出牌后会自动记在这里。每行是一墩，四家的牌都能回看。</p>';
 return '<table class="trick-table"><caption>本副公开出牌 · 数字表示出牌顺序</caption><thead><tr><th>墩</th>'+directions.map(d=>'<th scope="col">'+d+'</th>').join('')+'<th>赢墩</th></tr></thead><tbody>'+rows.slice().reverse().map(t=>'<tr><th scope="row">'+t.number+'</th>'+directions.map(s=>{const ix=t.cards.findIndex(x=>directions[x.seat]===s);if(ix<0)return '<td>—</td>';const c=t.cards[ix].card;return '<td><span class="record-card '+(red(c)?'red':'')+'">'+cardLabel(c)+'</span><small>'+ (ix+1) +'</small></td>'}).join('')+'<td>'+(t.winner===null?'进行中':directions[t.winner])+'</td></tr>').join('')+'</tbody></table>';
}
function renderHistory(){const host=$('#play-history');const position=host.scrollTop;host.innerHTML=historyMarkup();host.scrollTop=position;$('#history-count').textContent=state.completedTricks.length+' / 13 墩'}

$('#close-dialog').onclick=()=>$('#dialog').close();$('#pause').onclick=()=>{state.paused=!state.paused;clearTimeout(state.timer);render();if(!state.paused){if(state.trick.length===4)state.timer=setTimeout(resolveTrick,300);else schedule()}};$('#records').onclick=()=>show('本副出牌记录',historyMarkup());$('#conventions').onclick=()=>show('简化自然叫牌',`<p>计划采用以下固定约定，正式规则表仍待细化。</p><ul><li>五张高花开叫。</li><li>1NT 开叫：15～17 点。</li><li>强 2♣；其余二阶花色为弱开叫。</li><li>基础应叫、Stayman 和高花转移叫。</li></ul><p class="muted">本参考仅演示操作界面，电脑使用不叫与合法随机出牌，不代表上述叫牌体系已实现。</p>`);render();

const themeSelect=$('#theme-select');themeSelect.value=document.body.classList.contains('clear')?'clear':'classic';themeSelect.onchange=()=>{document.body.classList.remove('clear','classic');document.body.classList.add(themeSelect.value);document.title=(themeSelect.value==='clear'?'清爽蓝牌桌':'柔和绿牌桌')+' · 桥牌小聚'};
</script></body></html>
